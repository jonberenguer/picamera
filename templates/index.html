<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PiCam">
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <title>PiCam Controller</title>
  <link rel="stylesheet" href="/static/base.css?v={{ assets['base.css'] }}">
  <link rel="stylesheet" href="/static/app.css?v={{ assets['app.css'] }}">
</head>
<body{% if not pantilt.available %} class="no-pantilt"{% endif %}>

<header>
  <div class="live-dot" id="live-dot"></div>
  <h1>PiCam Controller</h1>
  <div class="spacer"></div>
  <div class="motion-badge" id="motion-badge">
    <div class="motion-dot"></div>
    Motion
  </div>
  <button class="icon-btn" id="scan-btn" title="Auto-scan">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M5 12h14M12 5l7 7-7 7"/>
    </svg>
  </button>
  <button class="icon-btn" id="gallery-btn" title="Motion gallery">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
      <rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>
    </svg>
  </button>
  <button class="icon-btn" id="snapshot-btn" title="Save snapshot">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/>
      <circle cx="12" cy="13" r="4"/>
    </svg>
  </button>
  <button class="icon-btn" id="home-btn" title="Go to home position">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
      <polyline points="9 22 9 12 15 12 15 22"/>
    </svg>
  </button>
  <button class="icon-btn" id="fullscreen-btn" title="Fullscreen">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 00-2 2v3m18 0V5a2 2 0 00-2-2h-3m0 18h3a2 2 0 002-2v-3M3 16v3a2 2 0 002 2h3"/>
    </svg>
  </button>
  <span class="hw-badge" id="nas-badge" style="display:none" title="Storage"></span>
  <span class="hw-badge" id="hw-badge">checking…</span>
  <a href="/logout" class="icon-btn" title="Sign out" style="text-decoration:none">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
  </a>
</header>

<div class="feed-wrap" id="feed-wrap">
  <img id="feed" src="/stream" alt="">
  <div class="drag-hint" id="drag-hint">drag to pan &amp; tilt</div>
  <div class="zoom-controls">
    <button class="zoom-btn" id="zoom-in-btn" title="Zoom in">+</button>
    <div class="zoom-level" id="zoom-level">1×</div>
    <button class="zoom-btn" id="zoom-out-btn" title="Zoom out">−</button>
  </div>
  <div class="feed-offline" id="offline-msg" style="display:none">
    <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M15 10l4.553-2.276A1 1 0 0121 8.723v6.554a1 1 0 01-1.447.894L15 14M3 8a2 2 0 012-2h10a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2V8z"/>
      <line x1="3" y1="3" x2="21" y2="21"/>
    </svg>
    No camera signal
  </div>
</div>

<div class="controls" id="controls">

  <div class="dpad">
    <button class="dpad-btn up"    data-dir="up"    title="Tilt up (↑)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 3L14 11H2z"/></svg>
    </button>
    <button class="dpad-btn left"  data-dir="left"  title="Pan left (←)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M3 8L11 2v12z"/></svg>
    </button>
    <div class="dpad-center"><div class="dpad-center-dot"></div></div>
    <button class="dpad-btn right" data-dir="right" title="Pan right (→)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M13 8L5 14V2z"/></svg>
    </button>
    <button class="dpad-btn down"  data-dir="down"  title="Tilt down (↓)">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="currentColor"><path d="M8 13L2 5h12z"/></svg>
    </button>
  </div>

  <div class="step-group">
    <span class="step-label">Speed</span>
    <div class="step-btns">
      <button class="step-btn" data-step="2">Fine</button>
      <button class="step-btn active" data-step="5">Normal</button>
      <button class="step-btn" data-step="15">Fast</button>
    </div>
  </div>

  <div class="position">
    <div class="pos-row">
      <div class="pos-header">
        <span class="pos-label">Pan</span>
        <span class="pos-value" id="pan-val">0°</span>
      </div>
      <div class="pos-track"><div class="pos-fill" id="pan-fill"></div></div>
    </div>
    <div class="pos-row">
      <div class="pos-header">
        <span class="pos-label">Tilt</span>
        <span class="pos-value" id="tilt-val">0°</span>
      </div>
      <div class="pos-track"><div class="pos-fill" id="tilt-fill"></div></div>
    </div>
  </div>

</div>

<div class="presets-bar" id="presets-bar">
  <div class="presets-slots" id="presets-slots"></div>
</div>

<div class="gallery-overlay" id="gallery-overlay">
  <div class="gallery-hdr">
    <button class="icon-btn" id="gallery-back-btn" title="Back to grid" style="display:none">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 12H5M12 5l-7 7 7 7"/>
      </svg>
    </button>
    <span class="gallery-hdr-title" id="gallery-hdr-title">Gallery</span>
    <div class="spacer"></div>
    <a class="icon-btn" id="gallery-dl-btn" title="Download" style="display:none" download>
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
    </a>
    <button class="icon-btn" id="gallery-close-btn" title="Close gallery">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>
  </div>
  <div class="gallery-grid" id="gallery-grid"></div>
  <div class="gallery-empty" id="gallery-empty">No motion captures yet</div>
  <div class="gallery-viewer" id="gallery-viewer">
    <img id="gallery-viewer-img" src="" alt="">
    <video id="gallery-viewer-video" controls playsinline style="display:none"></video>
  </div>
</div>

<!-- Everything the server decides at render time. app.js is static,
     so it cannot use Jinja and reads these values instead. -->
<script>window.PICAM = {"pantilt": {{ pantilt | tojson }}};</script>
<script src="/static/app.js?v={{ assets['app.js'] }}"></script>

</body>
</html>
